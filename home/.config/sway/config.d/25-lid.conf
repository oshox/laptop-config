# Turn the built-in display off when the lid closes, on again when it opens.
# Only targets the internal panel (eDP-1); external monitors are unaffected.
# logind handles suspend-on-battery; this drives the AC "stay awake, screen off" case.
bindswitch --reload --locked lid:on  output eDP-1 power off
bindswitch --reload --locked lid:off output eDP-1 power on
